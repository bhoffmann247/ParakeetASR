version: '3.8'

services:
  parakeet-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parakeet-transcription-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TEMP_DIR=/app/temp
    volumes:
      # Optional: Mount a volume for persistent model cache
      - model-cache:/root/.cache
      # Optional: Mount output directory for easy access
      - ./Output:/app/Output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

volumes:
  model-cache:
    driver: local
