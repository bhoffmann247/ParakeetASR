name: Build and Push to GHCR

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.sagemaker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image URL
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "=========================================="
          echo "✓ Image successfully pushed to GHCR!"
          echo "=========================================="
          echo "Image URI: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo ""
          echo "Available tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "To make the package public:"
          echo "1. Go to: https://github.com/${{ github.repository }}/packages"
          echo "2. Click on your package"
          echo "3. Package settings → Change visibility → Public"
          echo ""
          echo "Use this URI in your SageMaker deployment:"
          echo "  python sagemaker/deploy_simple.py \\"
          echo "    --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \\"
          echo "    --role YOUR_ROLE_ARN"
          echo "=========================================="
